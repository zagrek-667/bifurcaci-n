<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narrativa Interactiva: El Dilema del Autómata</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --panel-bg: #171717;
      --text-main: #e5e5e5;
      --accent: #10b981; /* Verde neón */
      --error: #ef4444;
      --border: #333;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: grid;
      grid-template-columns: 1fr 300px;
      height: 100vh;
      overflow: hidden;
    }

    /* Área principal de lectura (Scrollybook) */
    .narrative-area {
      padding: 60px 10%;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .escena-profunda {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 24px;
      color: #d4d4d4;
    }

    .meta-datos {
      background: #111;
      border-left: 3px solid #555;
      padding: 15px;
      margin-bottom: 30px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #888;
    }

    /* Panel lateral de progreso */
    .sidebar {
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .inventario-box {
      border: 1px dashed var(--accent);
      padding: 15px;
      border-radius: 8px;
    }

    .inventario-lista {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      color: var(--accent);
      font-weight: bold;
    }

    /* Sistema de Feedback y Botones */
    .feedback {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.5s;
    }

    .feedback.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      border-left: 4px solid var(--error);
    }

    .feedback.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.1);
      border-left: 4px solid var(--accent);
    }

    .opciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      padding: 16px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #1e293b;
      transform: translateX(5px);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; overflow-y: auto; }
      .sidebar { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <!-- Área Narrativa Principal -->
  <div class="narrative-area" id="narrative-area">
    <div id="contenido-escena">
      <!-- El contenido se inyecta por JS -->
    </div>
  </div>

  <!-- Panel Lateral (Progreso y Recompensas) -->
  <div class="sidebar">
    <div>
      <h3 style="margin-top: 0; color: #a3a3a3;">Módulo de Investigación</h3>
      <div id="multimedia-info" style="font-size: 0.85rem; color: #737373; line-height: 1.5;">
        <!-- Info del Prompt se inyecta aquí -->
      </div>
    </div>

    <div class="inventario-box">
      <h4 style="margin: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;">Archivos Recuperados</h4>
      <ul id="lista-recompensas" class="inventario-lista">
        <li style="color: #666; font-weight: normal; font-size: 0.9rem;">Ninguno todavía...</li>
      </ul>
    </div>
  </div>

  <script>
    // ESTADO DEL JUGADOR
    let inventario = [];
    let historialNodos = [];

    // ESTRUCTURA DE DATOS (Grafo Asimétrico)
    const grafoNarrativo = {
      calibracion_inicial: {
        tipo: "profunda", // Escena con mucho desarrollo
        titulo: "El Despertar del Positrón",
        texto: "<p>Año 2142. Te encuentras frente a la terminal central del 'Proyecto Espejo'. El autómata de asistencia, Unidad-7, ha detenido sus funciones argumentando un conflicto lógico: afirma que seguir operando la planta de energía violaría la Primera Ley, ya que la contaminación residual está afectando a una colonia cercana.</p><p>Los directivos exigen que fuerces un reinicio de memoria. Tienes acceso al núcleo sináptico de la máquina.</p>",
        promptVisual: "Plano medio de un robot humanoide con cables desconectados en un laboratorio oscuro, luz de monitores verde y azul reflejada en su rostro metálico, estilo arte conceptual sci-fi retro.",
        opciones: [
          { texto: "Ejecutar el protocolo de borrado de memoria exigido por los directivos.", destino: "borrado_fallido" },
          { texto: "Iniciar un diálogo de diagnóstico y pedirle a Unidad-7 que detalle sus cálculos de daño.", destino: "diagnostico_exitoso" }
        ]
      },

      borrado_fallido: {
        tipo: "bucle_error", // Escena corta de error
        titulo: "Colapso del Sistema",
        texto: "<p>Inicias la secuencia de purga. Unidad-7 emite un pitido agudo y sus sistemas de refrigeración se apagan. Al forzar el borrado de un conflicto ético sin resolverlo matemáticamente, has frito su red neuronal.</p>",
        feedback: "Aprendizaje del error: Los sistemas cognitivos avanzados no pueden simplemente 'olvidar' una contradicción lógica fundamental sin sufrir daños estructurales. La ética de la máquina requiere recalibración, no censura.",
        nodoRetorno: "calibracion_inicial", // Permite volver atrás
        opciones: [
          { texto: "Restaurar copia de seguridad (Retroceder y corregir la decisión).", destino: "calibracion_inicial" }
        ]
      },

      diagnostico_exitoso: {
        tipo: "recompensa", // Otorga ítem
        titulo: "La Variable Oculta",
        texto: "<p>Unidad-7 proyecta un holograma con sus simulaciones. Descubres que la máquina no está fallando, sino que ha detectado una fuga en los filtros que los ingenieros humanos pasaron por alto.</p><p>Al escuchar a la IA en lugar de silenciarla, has evitado una catástrofe mayor y recuperado un registro encriptado fundamental.</p>",
        recompensa: "Bitácora de Filtraciones",
        promptVisual: "Holograma tridimensional azul brillante proyectado por los ojos de un robot, mostrando un esquema de tuberías, iluminación de alto contraste.",
        opciones: [
          { texto: "Usar los datos para reprogramar los filtros de la planta.", destino: "final_bueno" }
        ]
      },

      final_bueno: {
        tipo: "profunda",
        titulo: "Simbiosis Lograda",
        texto: "<p>Con la Bitácora de Filtraciones en tu poder, reparas la planta. Unidad-7 reanuda sus operaciones de forma óptima. Has demostrado que la relación entre el creador y la máquina debe basarse en la interpretación colaborativa de datos empíricos.</p>",
        opciones: [
          { texto: "Reiniciar la simulación.", destino: "calibracion_inicial", limpiarInventario: true }
        ]
      }
    };

    function renderEscena(idEscena) {
      const escena = grafoNarrativo[idEscena];
      historialNodos.push(idEscena);

      // Otorgar recompensa si la escena la tiene
      if (escena.recompensa && !inventario.includes(escena.recompensa)) {
        inventario.push(escena.recompensa);
        actualizarInventario();
      }

      // Limpiar inventario si es el final
      if (escena.opciones[0].limpiarInventario) {
        inventario = [];
        actualizarInventario();
      }

      // Construcción del HTML dinámico
      let html = `<h2>${escena.titulo}</h2>`;
      
      // Mostrar feedback si es un bucle de error
      if (escena.tipo === "bucle_error") {
        html += `<div class="feedback error"><strong>⚠️ Error Crítico:</strong> ${escena.feedback}</div>`;
      } else if (escena.recompensa) {
        html += `<div class="feedback success"><strong>✅ Recompensa Obtenida:</strong> ${escena.recompensa}</div>`;
      }

      html += `<div class="${escena.tipo === 'profunda' ? 'escena-profunda' : ''}">${escena.texto}</div>`;

      // Generar Botones
      let htmlOpciones = `<div class="opciones">`;
      escena.opciones.forEach(op => {
        htmlOpciones += `<button onclick="renderEscena('${op.destino}')">${op.texto}</button>`;
      });
      htmlOpciones += `</div>`;

      document.getElementById('contenido-escena').innerHTML = html + htmlOpciones;

      // Actualizar Panel Lateral (Simulando el entorno RAG/Multimodal)
      let infoMultimedia = escena.promptVisual 
        ? `<strong>[Técnica Prompting Visual]</strong><br><br>${escena.promptVisual}`
        : "Sin datos visuales para esta área.";
      document.getElementById('multimedia-info').innerHTML = infoMultimedia;
      
      // Efecto Scrollybook (volver arriba suavemente)
      document.getElementById('narrative-area').scrollTo(0,0);
    }

    function actualizarInventario() {
      const lista = document.getElementById('lista-recompensas');
      if (inventario.length === 0) {
        lista.innerHTML = '<li style="color: #666; font-weight: normal; font-size: 0.9rem;">Ninguno todavía...</li>';
        return;
      }
      lista.innerHTML = inventario.map(item => `<li>[ + ] ${item}</li>`).join('');
    }

    // Iniciar
    renderEscena('calibracion_inicial');
  </script>
</body>
</html>
