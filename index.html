<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páramo Omega | El dilema del ecosistema sintético</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --panel-bg: #171717;
      --text-main: #e5e5e5;
      --muted: #93a79f;
      --accent-soft: rgba(184, 227, 107, 0.14);
      --cyan: #81d9d0;
      --accent: #10b981; /* Verde neón tecnológico */
      --error: #ef4444;
      --border: #333;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 12% 10%, rgba(129, 217, 208, 0.1), transparent 28%), linear-gradient(130deg, #07110f 0%, #0b1714 62%, #10251d 100%);
      color: var(--text-main);
      display: grid;
      grid-template-columns: 1fr 320px;
      height: 100vh;
      overflow: hidden;
    }

    /* Área principal de lectura (Scrollybook) */
    .narrative-area {
      padding: 60px 10%;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .escena-profunda {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 24px;
      color: #d4d4d4;
    }

    .escena-profunda p {
      margin-bottom: 20px;
    }

    /* Panel lateral de progreso e investigación */
    .sidebar {
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      overflow-y: auto;
    }
    .inventario-box {
      border: 1px dashed var(--accent);
      padding: 15px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.05);
    }

    .inventario-lista {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      color: var(--accent);
      font-weight: bold;
    }

    .inventario-lista li {
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    /* Sistema de Feedback (Autoaprendizaje) */
    .feedback {
      padding: 18px;
      border-radius: 6px;
      margin-bottom: 25px;
      display: none;
      animation: fadeIn 0.5s;
      line-height: 1.6;
    }

    .feedback.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      border-left: 4px solid var(--error);
      color: #fca5a5;
    }

    .feedback.success {
      display: block;
      border: 1px solid rgba(184, 227, 107, .35);
      padding: 15px;
      border-radius: 8px;
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      color: #6ee7b7;
    }

    /* Botones y Opciones */
    .opciones {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 40px;
      padding-bottom: 60px;
    }

    button {
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      padding: 18px;
      border-radius: 8px;
      font-size: 1.05rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      line-height: 1.4;
    }

    button:hover {
      border-color: var(--accent);
      background: #1e293b;
      transform: translateX(5px);
      box-shadow: -4px 0 0 var(--accent);
    }

    .tag-audio {
      display: inline-block;
      background: #333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-top: 10px;
      color: #aaa;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; overflow-y: auto; }
      .sidebar { border-left: none; border-top: 1px solid var(--border); }
      .narrative-area { height: auto; overflow-y: visible; padding: 30px 5%; }
    }

    body { font-family: 'Manrope', sans-serif; background-image: radial-gradient(circle at 12% 10%, rgba(129,217,208,.1), transparent 28%), linear-gradient(130deg, #07110f, #10251d); }
    .narrative-area { padding: 0 clamp(24px, 8vw, 128px) 80px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; padding: 28px 0 50px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; }
    .brand-mark { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
    .status, .eyebrow { color: var(--muted); font: 500 .7rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    .story-header { max-width: 780px; padding: 66px 0 42px; }

    .story-header p { max-width: 580px; color: var(--muted); line-height: 1.7; margin: 0; }
    .visual-stage { position: relative; min-height: 260px; overflow: hidden; border: 1px solid var(--border); background: linear-gradient(155deg, rgba(129,217,208,.18), transparent 45%), #07110f; }
    .stage-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .58; filter: saturate(.82) contrast(1.08); transition: opacity .5s ease, transform .8s ease; }
    .visual-stage:hover .stage-image { opacity: .72; transform: scale(1.025); }
    .visual-stage::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3,12,10,.8), rgba(3,12,10,.08) 70%), repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px); pointer-events: none; }
    .visual-stage::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 18px, rgba(184,227,107,.06) 19px 20px); transform: skewY(-8deg) scale(1.2); }
    .stage-label, .stage-caption { position: absolute; z-index: 1; left: 24px; color: var(--muted); font: .65rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .1em; }
    .stage-label { top: 22px; } .stage-caption { bottom: 22px; max-width: 260px; color: #fff; font: .85rem 'Manrope', sans-serif; line-height: 1.5; text-transform: none; letter-spacing: 0; }
    .stage-orbit { position: absolute; right: 12%; top: 24%; width: 130px; height: 130px; border: 1px solid rgba(184,227,107,.45); border-radius: 50%; box-shadow: 0 0 60px rgba(184,227,107,.08); }
    .stage-orbit::after { content: ''; position: absolute; width: 7px; height: 7px; right: 7px; top: 29px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
    .stage-mountain { position: absolute; right: 5%; bottom: -30px; width: 60%; height: 70%; background: linear-gradient(145deg, transparent 49%, rgba(129,217,208,.22) 50%, rgba(129,217,208,.05) 68%, transparent 69%); clip-path: polygon(0 100%,38% 22%,55% 58%,72% 0,100% 100%); }
    .scene-meta { display: flex; gap: 16px; margin: 24px 0 18px; color: var(--muted); font: .68rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .08em; }
    .scene-meta span:first-child { color: var(--accent); }
    .scene-context { display: inline-block; margin: 0 0 22px; padding: 8px 11px; border-left: 2px solid var(--cyan); color: var(--cyan); font: .7rem 'DM Mono', monospace; letter-spacing: .05em; }
    .scene-copy { position: relative; max-width: 720px; padding: 24px 28px; background: rgba(8, 21, 18, .72); border: 1px solid rgba(184,227,107,.22); box-shadow: 7px 7px 0 rgba(184,227,107,.08); }
    .scene-copy::before { content: 'NARRACIÓN'; position: absolute; top: -10px; left: 18px; padding: 2px 7px; background: var(--accent); color: #102019; font: 600 .58rem 'DM Mono', monospace; letter-spacing: .12em; transform: rotate(-2deg); }
    .production-actions { display: flex; gap: 8px; margin-top: 15px; }
    .production-actions button { padding: 10px 12px; font: 500 .68rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .04em; }
    .production-actions button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
    .production-status { margin-top: 12px; color: var(--cyan); font: .66rem 'DM Mono', monospace; }
    .frame-set { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding-top: 10px; }
    .frame-set p { position: relative; min-height: 110px; margin: 0; padding: 24px 20px 20px; color: #17251f; background: #f4e7bd; border: 3px solid #132c25; box-shadow: 5px 5px 0 rgba(4, 12, 10, .45); font-size: .92rem; line-height: 1.65; transform: rotate(-.7deg); }
    .frame-set p:nth-child(even) { background: #9fe0d2; transform: rotate(.8deg); }
    .frame-set p:nth-child(3n) { background: #f4a38f; }
    .frame-set p::before { content: 'ELIAN · REGISTRO'; position: absolute; top: -11px; left: 12px; padding: 3px 6px; color: #f4e7bd; background: #132c25; font: 500 .56rem 'DM Mono', monospace; letter-spacing: .1em; transform: rotate(-2deg); }
    .frame-set p::after { content: ''; position: absolute; right: 10px; bottom: 9px; width: 20px; height: 20px; border-right: 2px solid rgba(19,44,37,.3); border-bottom: 2px solid rgba(19,44,37,.3); }
    .sound-control { display: inline-flex; align-items: center; gap: 8px; color: var(--text-main); border-color: rgba(184,227,107,.45); padding: 9px 12px; font: 500 .66rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .05em; }
    .sound-control.is-on { color: #17251f; background: var(--accent); border-color: var(--accent); }
    .scene-enter { animation: sceneEnter .65s ease both; }
    @keyframes sceneEnter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .sidebar { padding: 30px 26px; background: rgba(7,27,23,.88); backdrop-filter: blur(16px); }
    .side-kicker { color: var(--muted); font: 500 .68rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 16px; }
    .progress-nav { display: grid; gap: 8px; }
    .progress-step { display: grid; grid-template-columns: 34px 22px 1fr; gap: 9px; align-items: center; color: #9bb5a9; font-size: .75rem; text-align: left; background: none; border: 0; padding: 7px 0; cursor: pointer; transform: none; box-shadow: none; }
    .progress-step img { width: 34px; height: 34px; object-fit: cover; border-radius: 50%; opacity: .72; border: 1px solid rgba(244,231,189,.3); filter: saturate(.7); }
    .progress-step.active img, .progress-step:hover img { opacity: 1; border-color: var(--accent); filter: saturate(1); }
    .progress-step:hover { color: var(--text-main); background: none; transform: none; box-shadow: none; }
    .progress-step span { display: grid; place-items: center; width: 20px; height: 20px; border: 1px solid currentColor; border-radius: 50%; font: .62rem 'DM Mono', monospace; }
    .progress-step.active { color: var(--accent); } .progress-step.visited { color: var(--cyan); }
    .metadata { border-top: 1px solid var(--border); padding-top: 24px; }
    #multimedia-info { color: var(--muted) !important; font-size: .78rem !important; line-height: 1.7 !important; background: none !important; border: 0 !important; padding: 0 !important; }
    #multimedia-info strong { color: var(--text-main) !important; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
    .inventario-box { border: 1px solid rgba(184,227,107,.35); background: rgba(184,227,107,.14); }
    .reward-badge { display: inline-flex; align-items: center; gap: 9px; margin: 4px 0 22px; padding: 10px 13px; color: #17251f; background: linear-gradient(135deg, #f4e7bd, #b8e36b); border: 2px solid #132c25; box-shadow: 4px 4px 0 rgba(244,163,143,.35); font: 600 .7rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .05em; animation: rewardReveal .7s ease both; }
    .reward-badge::before { content: '✦'; display: grid; place-items: center; width: 20px; height: 20px; color: #f4e7bd; background: #132c25; border-radius: 50%; font-size: .8rem; }
    .inventory-new { animation: rewardPulse 1.2s ease both; }
    @keyframes rewardReveal { from { opacity: 0; transform: translateY(8px) rotate(-2deg); } to { opacity: 1; transform: translateY(0) rotate(-1deg); } }
    @keyframes rewardPulse { 0%, 100% { color: var(--accent); } 45% { color: #fff; text-shadow: 0 0 14px var(--accent); } }
    button { background: rgba(255,255,255,.035); border-color: var(--border); border-radius: 2px; font-size: .95rem; }
    button:hover { background: rgba(184,227,107,.1); box-shadow: -3px 0 0 var(--accent); }
    .choice-detail { display: block; margin: 8px 0 0 28px; color: var(--muted); font: .68rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
    .dialogue-bubble { position: relative; max-width: 560px; margin: 18px 0 24px auto; padding: 16px 20px 16px 52px; color: #17251f; background: #f4e7bd; border: 3px solid #132c25; border-radius: 4px 22px 22px 22px; box-shadow: 5px 5px 0 rgba(244,163,143,.35); font-size: .95rem; line-height: 1.55; transform: rotate(.5deg); }
    .dialogue-bubble::before { content: 'ELIAN'; position: absolute; top: -12px; left: 15px; padding: 3px 7px; color: #f4e7bd; background: #132c25; font: 500 .58rem 'DM Mono', monospace; letter-spacing: .1em; }
    .dialogue-bubble::after { content: ''; position: absolute; left: 18px; bottom: -18px; width: 22px; height: 22px; background: #f4e7bd; border-right: 3px solid #132c25; border-bottom: 3px solid #132c25; transform: skew(-25deg) rotate(25deg); }
    .opciones { max-width: 760px; }
    .opciones button { position: relative; padding: 18px 22px 18px 58px; border: 2px solid rgba(244,231,189,.25); background: rgba(7,25,21,.82); box-shadow: 4px 4px 0 rgba(244,163,143,.15); }
    .opciones button > span { position: absolute; left: 19px; top: 18px; display: grid; place-items: center; width: 24px; height: 24px; color: #17251f !important; background: var(--accent); border-radius: 50%; font: 700 .68rem 'DM Mono', monospace; }
    .opciones button:hover { border-color: #f4a38f; background: #173b31; transform: translateX(7px) rotate(-.3deg); box-shadow: 6px 6px 0 rgba(244,163,143,.3); }
    .decision-heading { display: flex; align-items: baseline; gap: 12px; margin: 32px 0 12px; color: #f4e7bd; font: 600 .72rem 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .1em; }
    .decision-heading::before { content: '◆'; color: #f4a38f; }
    body { background-color: #102b25; background-image: linear-gradient(90deg, rgba(5,20,16,.93) 0%, rgba(5,20,16,.68) 42%, rgba(5,20,16,.78) 100%), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=88'), repeating-linear-gradient(112deg, rgba(244,231,189,.035) 0 1px, transparent 1px 22px); background-size: cover, cover, auto; background-position: center, center, center; background-attachment: fixed, fixed, fixed; }
    .topbar { border-bottom-color: rgba(244,231,189,.28); }
    .brand-mark { background: #f4a38f; box-shadow: 0 0 18px #f4a38f; }
    .scene-copy { background: rgba(7, 25, 21, .75); border-color: rgba(244,231,189,.32); box-shadow: 8px 8px 0 rgba(244,163,143,.2); }
    .visual-stage { border: 3px solid #132c25; box-shadow: 8px 8px 0 rgba(244,163,143,.18); }
    body { position: relative; isolation: isolate; background-image: linear-gradient(90deg, rgba(5,20,16,.9) 0%, rgba(5,20,16,.5) 45%, rgba(5,20,16,.7) 100%), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=90'); background-size: cover; background-position: center; background-attachment: fixed; }
    body::before { content: ''; position: fixed; z-index: -1; inset: 0; pointer-events: none; background: linear-gradient(130deg, rgba(8,35,28,.22), transparent 42%), url('https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1800&q=82'); background-size: cover; background-position: 82% center; mix-blend-mode: screen; opacity: .2; }
    .narrative-area { background: linear-gradient(90deg, rgba(5,20,16,.22), transparent 80%); }
    .sidebar { border-left: 0; background: rgba(7,27,23,.32); box-shadow: -18px 0 50px rgba(2,12,9,.12); }
    .metadata { border-top: 0; }
    .inventario-box { border-color: rgba(244,231,189,.2); background: rgba(7,27,23,.25); box-shadow: 0 12px 35px rgba(2,12,9,.12); }
    .progress-step { background: rgba(7,27,23,.18); border-radius: 999px; padding: 8px 10px; }
    .progress-step:hover { background: rgba(244,231,189,.1); }
    @media (max-width: 800px) { body { display: block; height: auto; overflow: visible; } .narrative-area { padding: 0 5% 48px; } .story-header { padding: 46px 0 32px; } .story-header h1 { font-size: clamp(2.7rem, 14vw, 4.5rem); } .visual-stage { min-height: 220px; } .progress-nav { grid-template-columns: repeat(3, 1fr); gap: 4px; } .progress-step { grid-template-columns: 1fr; justify-items: center; text-align: center; font-size: .62rem; } .progress-step img { width: 29px; height: 29px; } .frame-set { grid-template-columns: 1fr; gap: 16px; } .frame-set p, .frame-set p:nth-child(even) { transform: rotate(0); } }
  </style>
</head>
<body>

  <!-- Área Narrativa Principal -->
  <div class="narrative-area" id="narrative-area">
    <div id="contenido-escena">
      <!-- El contenido se inyecta por JavaScript -->
    </div>
  </div>

  <!-- Panel Lateral (Módulo de Investigación y Recompensas) -->
  <div class="sidebar">
    <div>
      <p class="side-kicker">Ruta de la simulación</p>
      <nav class="progress-nav" aria-label="Hitos narrativos">
        <button class="progress-step active" data-scene="llegada_paramo" onclick="renderEscena('llegada_paramo')"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=120&q=80" alt=""><span>01</span> Llegada</button>
        <button class="progress-step" data-scene="anulacion_fallida" onclick="renderEscena('anulacion_fallida')"><img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=120&q=80" alt=""><span>02</span> Rechazo</button>
        <button class="progress-step" data-scene="debate_logico" onclick="renderEscena('debate_logico')"><img src="https://images.unsplash.com/photo-1464278533981-50106e6176b1?auto=format&fit=crop&w=120&q=80" alt=""><span>03</span> Paradoja</button>
        <button class="progress-step" data-scene="diagnostico_humedad" onclick="renderEscena('diagnostico_humedad')"><img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=120&q=80" alt="Vegetación andina"><span>04</span> Frailejones</button>
        <button class="progress-step" data-scene="mediacion_comunitaria" onclick="renderEscena('mediacion_comunitaria')"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=120&q=80" alt=""><span>05</span> Custodia</button>
        <button class="progress-step" data-scene="equilibrio_alcanzado" onclick="renderEscena('equilibrio_alcanzado')"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=120&q=80" alt=""><span>06</span> Equilibrio</button>
      </nav>
    </div>
    <div class="metadata">
      <p class="side-kicker">Módulo de producción</p>
      <div id="multimedia-info" style="font-size: 0.85rem; color: #888; line-height: 1.6; background: #111; padding: 15px; border-radius: 6px; border: 1px solid #222;">
        <!-- Info del Prompt se inyecta aquí -->
      </div>
    </div>

    <div class="inventario-box">
      <h4 style="margin: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; color: var(--text-main);">Variables de Sistema Recuperadas</h4>
      <ul id="lista-recompensas" class="inventario-lista">
        <li style="color: #666; font-weight: normal; font-size: 0.9rem;">Sin datos en la memoria caché...</li>
      </ul>
    </div>
  </div>

  <script>
    // 1. ESTADO DEL JUGADOR
    let inventario = [];
    const escenasVisitadas = new Set();
    const etiquetasEscena = {
      llegada_paramo: 'Hito 01 / Llegada',
      anulacion_fallida: 'Hito 02 / Rechazo',
      debate_logico: 'Hito 03 / Paradoja',
      diagnostico_humedad: 'Hito 04 / Diagnóstico',
      mediacion_comunitaria: 'Hito 05 / Custodia',
      equilibrio_alcanzado: 'Hito 06 / Equilibrio'
    };
    const tipoEscena = {
      profunda: 'Exploración', bucle_error: 'Advertencia', recompensa: 'Decisión',
      investigacion: 'Evidencia', mediacion: 'Acuerdo'
    };
    const imagenesEscena = {
      llegada_paramo: [
        'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85',
        'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85'
      ],
      anulacion_fallida: ['https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=85'],
      debate_logico: ['https://images.unsplash.com/photo-1464278533981-50106e6176b1?auto=format&fit=crop&w=1600&q=85'],
      diagnostico_humedad: ['https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1600&q=88'],
      mediacion_comunitaria: ['https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85'],
      equilibrio_alcanzado: ['https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85']
    };
    const imagenActiva = {};
    let contextoAudio = null;
    let nodosAudio = [];
    let sonidoActivo = false;
    // 2. GRAFO NARRATIVO ASIMÉTRICO (Estructura JSON integrada)
    const grafoNarrativo = {
      llegada_paramo: {
        tipo: "profunda",

    // 3. MOTOR DE RENDERIZADO
    function renderEscena(idEscena) {
      const escena = grafoNarrativo[idEscena];
      escenasVisitadas.add(idEscena);

      // Lógica de Recompensas
      if (escena.recompensa && !inventario.includes(escena.recompensa)) {
        inventario.push(escena.recompensa);
        actualizarInventario();
      }

      // Lógica de Reseteo (para volver a jugar)
      if (escena.opciones[0].limpiarInventario) {
        inventario = [];
        escenasVisitadas.clear();
        escenasVisitadas.add(idEscena);
        actualizarInventario();
      }

      // Construcción del HTML dinámico
      let html = `<div class="topbar"><div class="brand"><span class="brand-mark"></span>Páramo Omega</div><div class="status">Simulación activa · 2150</div><button id="sound-toggle" class="sound-control" type="button" onclick="togglePaisajeSonoro()" aria-pressed="false">◉ Activar paisaje sonoro</button></div>`;
      if (idEscena === 'llegada_paramo') {
        html += `<header class="story-header"><span class="eyebrow">Archivo de campo / Cuenca Sumapaz</span><h1>El dilema del<br>ecosistema sintético</h1><p>Una historia interactiva sobre agua, inteligencia y los límites de proteger la vida.</p></header>`;
      }
      const imagenes = imagenesEscena[idEscena] || imagenesEscena.llegada_paramo;
      const indiceImagen = imagenActiva[idEscena] || 0;
      html += `<div class="visual-stage scene-${escena.tipo}"><img id="stage-image" class="stage-image" src="${imagenes[indiceImagen % imagenes.length]}" alt="Paisaje del páramo asociado a ${escena.titulo}" loading="eager"><span class="stage-label">Visualización de sistema · ${idEscena === 'equilibrio_alcanzado' ? 'flujo restaurado' : 'red hídrica en tensión'}</span><div class="stage-orbit"></div><div class="stage-mountain"></div><span class="stage-caption">${escena.audio || 'El sistema espera una decisión.'}</span></div><div class="scene-meta"><span>${etiquetasEscena[idEscena]}</span><span>${tipoEscena[escena.tipo] || 'Interfaz'}</span><span>Registro ${String(escenasVisitadas.size).padStart(2, '0')}</span></div><div class="scene-context">${escena.contexto || '18 de septiembre de 2150 · Páramo de Sumapaz'}</div><h2 style="font-size: 2rem; margin-top: 0; color: #fff;">${escena.titulo}</h2>${escena.dialogo ? `<div class="dialogue-bubble">${escena.dialogo}</div>` : ''}`;
      
      // Mostrar bloque de Autoaprendizaje si es un bucle de error
      if (escena.tipo === "bucle_error") {
        html += `<div class="feedback error"><strong>Análisis de Autoaprendizaje:</strong><br>${escena.feedback}</div>`;
      } else if (escena.recompensa) {
        html += `<div class="reward-badge" role="status">Premio encontrado · ${escena.recompensa}</div><div class="feedback success"><strong>Datos adquiridos:</strong><br>Ahora puedo usar esta evidencia para tomar una mejor decisión.</div>`;
      }

      // Inyectar texto narrativo
      html += `<div class="scene-copy ${escena.tipo === 'profunda' ? 'escena-profunda' : ''}"><div class="frame-set">${escena.texto}</div></div>`;

      // Inyectar Botones de Decisión
      let htmlOpciones = `<div class="decision-heading">Elige cómo continuar</div><div class="opciones">`;
      escena.opciones.forEach((op, index) => {
        htmlOpciones += `<button onclick="renderEscena('${op.destino}')">
          <span style="color: var(--accent); margin-right: 10px;">0${index + 1}</span>${op.texto}${op.detalle ? `<small class="choice-detail">${op.detalle}</small>` : ''}
        </button>`;
      });
      htmlOpciones += `</div>`;

      document.getElementById('contenido-escena').innerHTML = `<div class="scene-enter">${html + htmlOpciones}</div>`;
      document.querySelectorAll('.progress-step').forEach((paso) => {
        paso.classList.toggle('active', paso.dataset.scene === idEscena);
        paso.classList.toggle('visited', escenasVisitadas.has(paso.dataset.scene) && paso.dataset.scene !== idEscena);
      });

      // Actualizar Panel Lateral (Simulando el entorno de producción IA)
      let infoMultimedia = escena.promptVisual 
        ? `<div style="margin-bottom: 15px;"><strong style="color: #bbb;">Motor visual</strong><br><br>${escena.promptVisual}</div><div class="production-actions"><button type="button" onclick="generarImagen('${idEscena}')">✦ Generar variante</button><button type="button" onclick="escucharEscena()" aria-pressed="false">▶ Escuchar</button></div><div id="production-status" class="production-status">Imagen lista · voz disponible</div>`
        : "";
      
      if (escena.audio) {
        infoMultimedia += `<div><strong style="color: #bbb;">Diseño Sonoro:</strong><br>${escena.audio}</div>`;
      }
      
      if (!infoMultimedia) infoMultimedia = "Sin metadatos para esta área.";

      document.getElementById('multimedia-info').innerHTML = infoMultimedia;
      actualizarControlSonoro();
      
      // Volver el scroll arriba simulando el paso de página en el Scrollybook
      document.getElementById('narrative-area').scrollTo(0,0);
    }

    function generarImagen(idEscena) {
      const imagenes = imagenesEscena[idEscena] || imagenesEscena.llegada_paramo;
      imagenActiva[idEscena] = ((imagenActiva[idEscena] || 0) + 1) % imagenes.length;
      const imagen = document.getElementById('stage-image');
      if (imagen) {
        imagen.style.opacity = '0';
        setTimeout(() => {
          imagen.src = imagenes[imagenActiva[idEscena]];
          imagen.style.opacity = '.72';
        }, 180);
      }
      const estado = document.getElementById('production-status');
      if (estado) estado.textContent = `Variante ${imagenActiva[idEscena] + 1} lista · basada en el prompt de escena`;
    }

    function escucharEscena() {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const texto = document.querySelector('.scene-copy')?.innerText || '';
      const lectura = new SpeechSynthesisUtterance(texto);
      lectura.lang = 'es-ES';
      lectura.rate = .92;
      lectura.pitch = .9;
      lectura.onstart = () => document.querySelector('.production-status').textContent = 'Narración en curso · voz de Elian';
      lectura.onend = () => document.querySelector('.production-status').textContent = 'Narración terminada · lista para repetir';
      speechSynthesis.speak(lectura);
    }

    function actualizarControlSonoro() {
      const control = document.getElementById('sound-toggle');
      if (!control) return;
      control.classList.toggle('is-on', sonidoActivo);
      control.setAttribute('aria-pressed', String(sonidoActivo));
      control.textContent = sonidoActivo ? '◉ Paisaje sonoro activo' : '◉ Activar paisaje sonoro';
    }

    function iniciarPaisajeSonoro() {
      if (sonidoActivo) return;
      const ConstructorAudio = window.AudioContext || window.webkitAudioContext;
      if (!ConstructorAudio) return;
      contextoAudio = contextoAudio || new ConstructorAudio();
      if (contextoAudio.state === 'suspended') contextoAudio.resume();
      const salida = contextoAudio.createGain();
      salida.gain.value = .075;
      salida.connect(contextoAudio.destination);

      const buffer = contextoAudio.createBuffer(1, contextoAudio.sampleRate * 3, contextoAudio.sampleRate);
      const datos = buffer.getChannelData(0);
      for (let i = 0; i < datos.length; i += 1) datos[i] = (Math.random() * 2 - 1) * .28;
      const viento = contextoAudio.createBufferSource();
      const vientoFiltro = contextoAudio.createBiquadFilter();
      const vientoGain = contextoAudio.createGain();
      const oleaje = contextoAudio.createOscillator();
      const oleajeGain = contextoAudio.createGain();
      viento.buffer = buffer;
      viento.loop = true;
      vientoFiltro.type = 'lowpass';
      vientoFiltro.frequency.value = 900;
      vientoGain.gain.value = .32;
      viento.connect(vientoFiltro).connect(vientoGain).connect(salida);
      oleaje.type = 'sine';
      oleaje.frequency.value = .16;
      oleajeGain.gain.value = 300;
      oleaje.connect(oleajeGain).connect(vientoFiltro.frequency);

      const piano = contextoAudio.createGain();
      piano.gain.setValueAtTime(.001, contextoAudio.currentTime);
      piano.gain.exponentialRampToValueAtTime(.16, contextoAudio.currentTime + .04);
      piano.gain.exponentialRampToValueAtTime(.001, contextoAudio.currentTime + 2.6);
      piano.connect(salida);
      [261.63, 329.63, 392, 523.25].forEach((frecuencia, indice) => {
        const nota = contextoAudio.createOscillator();
        nota.type = 'sine';
        nota.frequency.value = frecuencia;
        nota.connect(piano);
        nota.start(contextoAudio.currentTime + indice * .16);
        nota.stop(contextoAudio.currentTime + 2.8);
      });
      viento.start();
      oleaje.start();
      nodosAudio = [viento, oleaje, salida];
      sonidoActivo = true;
      actualizarControlSonoro();
    }

    function detenerPaisajeSonoro() {
      nodosAudio.forEach((nodo) => {
        if (typeof nodo.stop === 'function') {
          try { nodo.stop(); } catch (error) { }
        }
        if (typeof nodo.disconnect === 'function') nodo.disconnect();
      });
      nodosAudio = [];
      sonidoActivo = false;
      actualizarControlSonoro();
    }

    function togglePaisajeSonoro() {
      if (sonidoActivo) detenerPaisajeSonoro();
      else iniciarPaisajeSonoro();
    }

    // 4. ACTUALIZACIÓN DE INTERFAZ LATERAL
    function actualizarInventario() {
      const lista = document.getElementById('lista-recompensas');
      if (inventario.length === 0) {
        lista.innerHTML = '<li style="color: #666; font-weight: normal; font-size: 0.9rem;">Sin datos en la memoria caché...</li>';
        return;
      }
      lista.innerHTML = inventario.map(item => `<li class="inventory-new"><span style="color: #fff;">✦</span> ${item}</li>`).join('');
    }

    // 5. INICIALIZAR LA APLICACIÓN
    window.onload = () => {
      renderEscena('llegada_paramo');
      document.addEventListener('pointerdown', (evento) => {
        if (!evento.target.closest('#sound-toggle')) iniciarPaisajeSonoro();
      }, { once: true });
    };
  </script>
