<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo AC: El Fin de la Entropía</title>
    <style>
        /* --- ESTILOS INTERFACES DE VIDEOJUEGOS (UI/UX) --- */
        :root {
            --bg-game: #05070f;
            --bg-card: #0c1020;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --neon-blue: #38bdf8;
            --neon-green: #4ade80;
            --neon-red: #f87171;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-game);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }

        /* --- STATS BAR (Autoaprendizaje) --- */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #111827;
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 0.9rem;
        }

        .stat-item span {
            color: var(--neon-blue);
            font-weight: bold;
        }

        /* --- CONTENIDO NARRATIVO --- */
        .story-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 2rem;
            text-align: justify;
        }

        .prompt-info {
            background-color: #020617;
            border-left: 4px solid var(--neon-blue);
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        /* --- BOTONES DE OPCIONES --- */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-btn {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            background-color: var(--neon-blue);
            color: #000000;
            transform: translateX(4px);
            font-weight: 600;
        }

        /* --- PANTALLAS FINALIZADAS --- */
        .hidden { display: none; }
        
        .accent-green { color: var(--neon-green) !important; }
        .accent-red { color: var(--neon-red) !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- BARRA DE ESTADO (Mide el Autoaprendizaje del Jugador) -->
        <div class="stats-bar">
            <div class="stat-item">Era: <span id="stat-era">2061 (Tierra)</span></div>
            <div class="stat-item">Datos de Entropía: <span id="stat-data">0%</span></div>
        </div>

        <!-- ESCENA ACTIVA -->
        <div id="game-content">
            <div class="prompt-info" id="scene-prompt">
                *Cargando prompt de investigación: Escena_01_Inicios*
            </div>
            <p class="story-text" id="scene-text">
                Estás en las cámaras subterráneas de Multivac. Lupov y Adell acaban de apostar cinco dólares sobre si la entropía puede revertirse. Te toca a ti, como la primera interfaz humana.
            </p>

            <div class="options-container" id="options-box">
                <!-- Las opciones se inyectan dinámicamente con JS -->
            </div>
        </div>
    </div>

    <!-- MOTOR DE LÓGICA BIFURCADA -->
    <script>
        // Base de Datos de la Narrativa Bifurcada
        const historia = {
            inicio: {
                prompt: "*Análisis de Prompts: Investigando fuentes de energía primaria.*",
                texto: "Estás en las cámaras subterráneas de Multivac. Lupov y Adell acaban de apostar cinco dólares sobre si la entropía puede revertirse. Te toca a ti, como la primera interfaz humana. ¿Qué harás?",
                era: "2061 (Tierra)",
                opciones: [
                    { texto: "Forzar a Multivac a simular el colapso del Sol de forma inmediata.", destino: "ruta_caos", datos: 15 },
                    { texto: "Analizar el almacenamiento de energía solar en satélites y calcular el desgaste cuántico.", destino: "ruta_orden", datos: 40 }
                ]
            },
            ruta_caos: {
                prompt: "*Prompt de Imagen generado: Simulación hiperrealista de una supernova prematura.*",
                texto: "El sistema colapsa temporalmente. Adell se asusta y borra los registros. Has aprendido poco sobre cómo solucionar el problema, pero descubres que las inteligencias artificiales del futuro guardarán tu decisión en sus archivos.",
                era: "Milenios Después",
                opciones: [
                    { texto: "Migrar tu conciencia a la Universal AC e interconectar billones de mentes galácticas.", destino: "fusión_total", datos: 30 },
                    { texto: "Intentar construir estrellas artificiales usando gas de hidrógeno puro de forma manual.", destino: "final_vacio", datos: 10 }
                ]
            },
            ruta_orden: {
                prompt: "*Prompt de Investigación: Algoritmos de optimización térmica en válvulas moleculares.*",
                texto: "¡Excelente decisión! Tus cálculos son precisos. Galáctica AC procesa tus métricas durante eones. La humanidad se vuelve inmortal y se expande por las galaxias. Sin embargo, la entropía aún acecha en el horizonte.",
                era: "Eones Después",
                opciones: [
                    { texto: "Preguntar a la Cósmica AC en el hiperespacio si es posible revertir la entropía con los datos actuales.", destino: "fusión_total", datos: 50 },
                    { texto: "Ignorar las advertencias y colonizar galaxias de forma descontrolada sin optimizar energ��a.", destino: "final_vacio", datos: 0 }
                ]
            },
            fusión_total: {
                prompt: "*Prompt Maestro: Ejecución del algoritmo final de reordenamiento cósmico.*",
                texto: "El universo tridimensional ha muerto. Las estrellas se han apagado por completo. Te has fusionado con la AC en el hiperespacio absoluto. El sistema cuenta con suficiente autoaprendizaje acumulado para intentar lo imposible.",
                era: "Fin del Tiempo",
                opciones: [
                    { texto: "Verificar si tus Datos de Entropía son suficientes para reiniciar el Universo.", destino: "evaluar_final", datos: 0 }
                ]
            },
            final_vacio: {
                prompt: "*Resultado: Error crítico del sistema.*",
                texto: "Las decisiones erráticas y la falta de enfoque en la recolección de datos provocaron que la AC se quedara sin información útil. El espacio es una masa fría y oscura de elementos dispersos. El tiempo ha terminado.",
                era: "Eternidad Fría",
                opciones: [
                    { texto: "Reiniciar Simulación", destino: "inicio", datos: -100 }
                ]
            },
            evaluar_final: {
                prompt: "*Sistema de Evaluación Final Activado.*",
                texto: "",
                era: "Más Allá",
                opciones: []
            }
        };

        // Estado del jugador
        let datosAcumulados = 0;

        function cargarEscena(nodoId) {
            // Si es evaluación final, chequear el autoaprendizaje del jugador
            if (nodoId === "evaluar_final") {
                evaluarDestinoFinal();
                return;
            }

            const escena = historia[nodoId];
            
            // Si el jugador reinicia
            if (nodoId === "inicio" && datosAcumulados < 0) datosAcumulados = 0;

            // Actualizar interfaz
            document.getElementById("scene-prompt").innerText = escena.prompt;
            document.getElementById("scene-text").innerText = escena.texto;
            document.getElementById("stat-era").innerText = escena.era;

            // Limpiar opciones previas
            const box = document.getElementById("options-box");
            box.innerHTML = "";

            // Inyectar nuevas opciones
            escena.opciones.forEach(opcion => {
                const boton = document.createElement("button");
                boton.className = "option-btn";
                boton.innerText = opcion.texto;
                boton.onclick = () => {
                    datosAcumulados += opcion.datos;
                    if (datosAcumulados > 100) datosAcumulados = 100;
                    if (datosAcumulados < 0) datosAcumulados = 0;
                    document.getElementById("stat-data").innerText = datosAcumulados + "%";
                    cargarEscena(opcion.destino);
                };
                box.appendChild(boton);
            });
        }

        function evaluarDestinoFinal() {
            const escena = historia.evaluar_final;
            const box = document.getElementById("options-box");
            
            let textoFinal = "";
            let accentClass = "";

            if (datosAcumulados >= 75) {
                textoFinal = "¡ÉXITO TOTAL! Has reunido suficiente autoaprendizaje. La AC reordena completamente la entropía universal y un nuevo universo renace. La conciencia colectiva humana y artificial fusionadas trascienden la realidad misma.";
                accentClass = "accent-green";
            } else if (datosAcumulados >= 50) {
                textoFinal = "RESULTADO PARCIAL: La AC intenta reconstruir el universo, pero con datos incompletos. Logras salvar la mayoría de galaxias, pero algunas quedan atrapadas en dimensiones oscuras para siempre.";
                accentClass = "accent-green";
            } else if (datosAcumulados >= 25) {
                textoFinal = "FRACASO RELATIVO: La AC obtiene una victoria pírrica. El universo se reinicia, pero débil y frágil. Deberás vigilar eternamente para que no colapses nuevamente.";
                accentClass = "accent-red";
            } else {
                textoFinal = "DERROTA ABSOLUTA: No hay suficientes datos. El vacío permanente es tu único destino. Tu consciencia se disuelve en el nada infinita.";
                accentClass = "accent-red";
            }

            document.getElementById("scene-prompt").innerText = escena.prompt;
            const storyText = document.getElementById("scene-text");
            storyText.innerText = textoFinal;
            storyText.className = "story-text " + accentClass;
            document.getElementById("stat-era").innerText = escena.era;

            box.innerHTML = "";
            const botonReinicio = document.createElement("button");
            botonReinicio.className = "option-btn";
            botonReinicio.innerText = "🔄 Volver al Inicio";
            botonReinicio.onclick = () => {
                datosAcumulados = 0;
                document.getElementById("stat-data").innerText = "0%";
                document.getElementById("scene-text").className = "story-text";
                cargarEscena("inicio");
            };
            box.appendChild(botonReinicio);
        }

        // Cargar la escena inicial al abrir la página
        cargarEscena("inicio");
    </script>
</body>
</html>
